name: Release

# 推送 v* 标签时：
# 1. 构建扩展并分别打包 Edge / Firefox zip → GitHub Release
# 2. 构建 @mediasync/mcp-server、@mediasync/cli 并发布到 npm（需 NPM_TOKEN）
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（无需 v 前缀，如 2.1.0）。留空则读取扩展 manifest 的 version。'
        required: false

permissions:
  contents: write

jobs:
  # ── 构建扩展（Edge + Firefox 两套包）──
  build-extension:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build extension
        run: pnpm --filter @mediasync/extension build

      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./packages/extension/package.json').version")" >> $GITHUB_OUTPUT

      - name: Package Edge + Firefox zips
        # 必须用 run pack：裸 pack 会走 pnpm 内置 pack（npm tarball），不会执行 scripts/pack-zip.mjs
        run: pnpm --filter @mediasync/extension run pack

      - name: Upload extension artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-zips
          path: |
            mediasync-*-edge.zip
            mediasync-*-firefox.zip

  # ── 发布 npm 包（mcp-server、cli）──
  publish-npm:
    runs-on: ubuntu-latest
    needs: build-extension
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          pnpm --filter @mediasync/mcp-server build
          pnpm --filter @mediasync/cli build

      - name: Publish @mediasync/mcp-server
        continue-on-error: true
        run: pnpm --filter @mediasync/mcp-server publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @mediasync/cli
        continue-on-error: true
        run: pnpm --filter @mediasync/cli publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── 创建 GitHub Release ──
  release:
    runs-on: ubuntu-latest
    needs: build-extension
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./packages/extension/package.json').version")" >> $GITHUB_OUTPUT

      - name: Download extension artifacts
        uses: actions/download-artifact@v4
        with:
          name: extension-zips

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          # 截取 ## vX.Y.Z 到下一个 ## 之间的正文（不含标题行）
          awk -v ver="$VERSION" '
            $0 ~ "^## v" ver "($| )" {found=1; next}
            found && /^## / {exit}
            found && NF {print}
            found && /^---$/ {exit}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "- 详见 CHANGELOG.md" > release-notes.md
          fi
          {
            echo "## 更新内容"
            echo
            cat release-notes.md
            echo
            echo "## 扩展包"
            echo
            echo "- \`mediasync-${VERSION}-edge.zip\` — Chrome / Edge（仅 \`background.service_worker\`）"
            echo "- \`mediasync-${VERSION}-firefox.zip\` — Firefox AMO（含 \`scripts\` 回退与 \`gecko\` 声明）"
          } > release-notes-full.md
          mv release-notes-full.md release-notes.md
          echo "----- release notes -----"
          cat release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
          name: v${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          generate_release_notes: false
          files: |
            mediasync-*-edge.zip
            mediasync-*-firefox.zip
          make_latest: true
