name: Release

# 推送 v* 标签时：
# 1. 构建 Chrome 扩展并打包 zip → GitHub Release
# 2. 构建 @mediasync/mcp-server、@mediasync/cli 并发布到 npm（需 NPM_TOKEN）
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（无需 v 前缀，如 2.1.0）。留空则读取扩展 manifest 的 version。'
        required: false

permissions:
  contents: write

jobs:
  # ── 构建 Chrome 扩展 ──
  build-extension:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build extension
        run: pnpm --filter @mediasync/extension build

      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./packages/extension/package.json').version")" >> $GITHUB_OUTPUT

      - name: Package extension zip
        run: |
          cd packages/extension/dist
          zip -r "$GITHUB_WORKSPACE/mediasync-${{ steps.ver.outputs.version }}.zip" .

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: mediasync-*.zip

  # ── 发布 npm 包（mcp-server、cli）──
  publish-npm:
    runs-on: ubuntu-latest
    needs: build-extension
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          pnpm --filter @mediasync/mcp-server build
          pnpm --filter @mediasync/cli build

      - name: Publish @mediasync/mcp-server
        continue-on-error: true
        run: pnpm --filter @mediasync/mcp-server publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @mediasync/cli
        continue-on-error: true
        run: pnpm --filter @mediasync/cli publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── 创建 GitHub Release ──
  release:
    runs-on: ubuntu-latest
    needs: build-extension
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./packages/extension/package.json').version")" >> $GITHUB_OUTPUT

      - name: Download extension artifact
        uses: actions/download-artifact@v4
        with:
          name: extension-zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
          name: v${{ steps.ver.outputs.version }}
          body: |
            ## 安装

            1. 下载下方 `mediasync-${{ steps.ver.outputs.version }}.zip` 并解压
            2. 打开 `chrome://extensions`，开启「开发者模式」
            3. 点击「加载已解压的扩展程序」，选择解压后的目录

            ## npm

            ```
            npm install -g @mediasync/cli
            ```
          generate_release_notes: true
          files: mediasync-*.zip
